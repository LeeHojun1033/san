<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 할 일 체크리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* 웹 환경에서 네이티브 달력 아이콘 클릭 유도를 위한 스타일 커스텀 */
        input[type="date"]::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 selection:bg-indigo-100 selection:text-indigo-900 py-10 px-4 sm:px-6 lg:px-8 flex justify-center">

    <div class="w-full max-w-md">
        
        <header class="mb-8 text-center relative">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2 tracking-tight">
                오늘의 할 일 <span class="text-indigo-600">체크리스트</span>
            </h1>
            
            <!-- 달력 필터 래퍼 (날짜 클릭 시 네이티브 달력 팝업) -->
            <div class="relative inline-flex items-center justify-center gap-1.5 cursor-pointer group px-3 py-1 rounded-lg hover:bg-gray-100 transition-colors">
                <p id="current-date-display" class="text-gray-500 font-medium group-hover:text-indigo-600 transition-colors"></p>
                <i class="fas fa-calendar-alt text-gray-400 group-hover:text-indigo-600 transition-colors text-sm"></i>
                
                <!-- 모바일 네이티브 날짜 선택기 -->
                <input type="date" id="date-picker-input" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
            </div>

            <!-- 다른 날짜 선택 시 나타나는 '오늘로 돌아가기' 버튼 -->
            <div id="back-to-today-container" class="mt-2 hidden">
                <button type="button" id="btn-back-to-today" class="text-xs text-indigo-700 bg-indigo-100 px-3 py-1.5 rounded-full hover:bg-indigo-200 transition-colors font-semibold shadow-sm">
                    <i class="fas fa-undo-alt mr-1"></i> 오늘로 돌아가기
                </button>
            </div>
        </header>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <div class="flex justify-between items-end mb-2">
                <span class="text-sm font-bold text-gray-700">달성률</span>
                <span id="progress-percent-display" class="text-2xl font-black text-indigo-600">0%</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                <div id="progress-bar-fill" class="bg-indigo-600 h-3 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
            </div>
            <p id="progress-text" class="text-xs text-gray-400 mt-3 text-right">
                총 0개 중 0개 완료
            </p>
        </div>

        <form id="task-form" class="mb-8 p-1">
            <div class="flex flex-col gap-3">
                <div class="relative flex items-center">
                    <input
                        type="text"
                        id="task-title-input"
                        placeholder="새로운 할 일을 입력하세요..."
                        class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-700"
                    />
                    <button
                        type="submit"
                        class="absolute right-2 p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors shadow-sm"
                        title="추가"
                    >
                        <i class="fas fa-plus w-5 h-5 flex items-center justify-center"></i>
                    </button>
                </div>
                
                <p id="form-error-msg" class="text-red-500 text-sm ml-1 flex items-center gap-1 hidden">
                    <i class="fas fa-exclamation-circle text-xs"></i> <span>할 일을 입력해주세요.</span>
                </p>

                <div class="flex flex-wrap gap-2 mt-1" id="repeat-type-container">
                    <button type="button" data-type="NONE" class="repeat-btn flex-1 sm:flex-none px-3 py-2 sm:py-1.5 rounded-lg text-sm font-medium transition-colors bg-indigo-100 text-indigo-700 border border-indigo-200">일회성</button>
                    <button type="button" data-type="DAILY" class="repeat-btn flex-1 sm:flex-none px-3 py-2 sm:py-1.5 rounded-lg text-sm font-medium transition-colors bg-gray-50 text-gray-500 border border-gray-200 hover:bg-gray-100">매일</button>
                    <button type="button" data-type="WEEKDAYS" class="repeat-btn flex-1 sm:flex-none px-3 py-2 sm:py-1.5 rounded-lg text-sm font-medium transition-colors bg-gray-50 text-gray-500 border border-gray-200 hover:bg-gray-100">주중</button>
                    <button type="button" data-type="WEEKENDS" class="repeat-btn flex-1 sm:flex-none px-3 py-2 sm:py-1.5 rounded-lg text-sm font-medium transition-colors bg-gray-50 text-gray-500 border border-gray-200 hover:bg-gray-100">주말</button>
                </div>
            </div>
        </form>

        <div class="mb-20">
            <h2 class="text-lg font-bold text-gray-800 mb-4 px-1 flex items-center gap-2">
                <span class="w-1.5 h-5 bg-indigo-500 rounded-full inline-block"></span>
                <span id="list-title">진행 중인 작업</span>
            </h2>
            
            <div id="task-list-container" class="space-y-2">
                <!-- Javascript를 통해 할 일 목록 주입 -->
            </div>
            
            <div id="empty-state" class="text-center py-16 bg-white border border-gray-100 rounded-2xl shadow-sm hidden">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check-circle text-3xl text-gray-400"></i>
                </div>
                <h3 id="empty-state-title" class="text-lg font-bold text-gray-700">오늘 할 일이 없습니다!</h3>
                <p id="empty-state-desc" class="text-gray-500 mt-1 text-sm">새로운 목표를 추가해 하루를 알차게 보내세요.</p>
            </div>
        </div>

    </div>

    <div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="delete-modal-content">
            <div class="p-6">
                <div class="flex items-center gap-3 text-amber-500 mb-4">
                    <i class="fas fa-exclamation-triangle text-2xl"></i>
                    <h3 class="text-lg font-bold text-gray-900">확인 필요</h3>
                </div>
                <p class="text-gray-600 leading-relaxed">정말로 이 할 일을 삭제하시겠습니까?</p>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end gap-3">
                <button id="cancel-delete-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
                    취소
                </button>
                <button id="confirm-delete-btn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 transition-colors">
                    삭제하기
                </button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'vanilla-todo-storage-v1';
        const REPEAT_LABELS = {
            NONE: '일회성',
            DAILY: '매일',
            WEEKDAYS: '주중 (월~금)',
            WEEKENDS: '주말 (토~일)'
        };

        let state = {
            tasks: [],
            lastAccessedDate: null
        };
        let currentRepeatType = 'NONE';
        let taskToDeleteId = null;
        let currentViewDate = ''; // 사용자가 달력에서 선택해 보고 있는 날짜 (기본값: 오늘)

        const elements = {
            dateDisplay: document.getElementById('current-date-display'),
            datePickerInput: document.getElementById('date-picker-input'),
            backToTodayContainer: document.getElementById('back-to-today-container'),
            btnBackToToday: document.getElementById('btn-back-to-today'),
            listTitle: document.getElementById('list-title'),
            progressPercent: document.getElementById('progress-percent-display'),
            progressBar: document.getElementById('progress-bar-fill'),
            progressText: document.getElementById('progress-text'),
            taskForm: document.getElementById('task-form'),
            titleInput: document.getElementById('task-title-input'),
            errorMsg: document.getElementById('form-error-msg'),
            repeatBtns: document.querySelectorAll('.repeat-btn'),
            taskList: document.getElementById('task-list-container'),
            emptyState: document.getElementById('empty-state'),
            emptyStateTitle: document.getElementById('empty-state-title'),
            emptyStateDesc: document.getElementById('empty-state-desc'),
            deleteModal: document.getElementById('delete-modal'),
            deleteModalContent: document.getElementById('delete-modal-content'),
            cancelDeleteBtn: document.getElementById('cancel-delete-btn'),
            confirmDeleteBtn: document.getElementById('confirm-delete-btn'),
        };

        const getTodayString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substring(2);

        const loadState = () => {
            const savedState = localStorage.getItem(STORAGE_KEY);
            if (savedState) {
                state = JSON.parse(savedState);
            }
        };

        const saveState = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            renderTasks();
        };

        const checkAndResetDailyTasks = () => {
            const currentToday = getTodayString();
            if (state.lastAccessedDate !== currentToday) {
                state.tasks = state.tasks.map(task => {
                    if (task.repeatType !== 'NONE') {
                        return { ...task, isCompleted: false };
                    }
                    return task;
                });
                state.lastAccessedDate = currentToday;
                saveState(); // renderTasks()도 포함됨
            }
        };

        // Timezone 이슈를 막기 위해 YYYY-MM-DD 문자열을 로컬 시간 객체로 변환
        const parseDateString = (dateStr) => {
            const [y, m, d] = dateStr.split('-');
            return new Date(y, m - 1, d);
        };

        const updateHeader = () => {
            const dateObj = parseDateString(currentViewDate);
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            elements.dateDisplay.textContent = dateObj.toLocaleDateString('ko-KR', options);
            elements.datePickerInput.value = currentViewDate;

            // '오늘'이 아닌 날짜를 보고 있으면 복귀 버튼과 타이틀 변경
            if (currentViewDate !== getTodayString()) {
                elements.backToTodayContainer.classList.remove('hidden');
                elements.listTitle.textContent = `${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일의 작업`;
                elements.emptyStateTitle.textContent = '해당 날짜에 할 일이 없습니다!';
                elements.emptyStateDesc.textContent = '이 날짜에 새로운 목표를 추가해보세요.';
            } else {
                elements.backToTodayContainer.classList.add('hidden');
                elements.listTitle.textContent = '진행 중인 작업';
                elements.emptyStateTitle.textContent = '오늘 할 일이 없습니다!';
                elements.emptyStateDesc.textContent = '새로운 목표를 추가해 하루를 알차게 보내세요.';
            }
        };

        const getTasksForViewDate = () => {
            const viewDateObj = parseDateString(currentViewDate);
            const dayOfWeek = viewDateObj.getDay(); // 0(일) ~ 6(토)
            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
            const isWeekday = dayOfWeek >= 1 && dayOfWeek <= 5;

            return state.tasks.filter(task => {
                switch (task.repeatType) {
                    case 'DAILY': return true;
                    case 'WEEKDAYS': return isWeekday;
                    case 'WEEKENDS': return isWeekend;
                    case 'NONE':
                    default: return task.createdDate === currentViewDate;
                }
            });
        };

        const updateProgress = (viewTasks) => {
            const completedCount = viewTasks.filter(t => t.isCompleted).length;
            const totalCount = viewTasks.length;
            const progressPercent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

            elements.progressPercent.textContent = `${progressPercent}%`;
            elements.progressBar.style.width = `${progressPercent}%`;
            elements.progressText.textContent = `총 ${totalCount}개 중 ${completedCount}개 완료`;
        };

        // 달력 날짜 변경 이벤트
        elements.datePickerInput.addEventListener('change', (e) => {
            if (e.target.value) {
                currentViewDate = e.target.value;
                updateHeader();
                renderTasks();
            }
        });

        // 오늘로 돌아가기 이벤트
        elements.btnBackToToday.addEventListener('click', () => {
            currentViewDate = getTodayString();
            updateHeader();
            renderTasks();
        });

        const setupRepeatTypeButtons = (containerId = null, onSelect = null) => {
            let btns;
            if(containerId) {
                btns = document.getElementById(containerId).querySelectorAll('.repeat-btn');
            } else {
                btns = elements.repeatBtns;
            }
            
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const selectedType = e.target.dataset.type;
                    
                    if(onSelect) {
                        onSelect(selectedType);
                    } else {
                        currentRepeatType = selectedType;
                    }

                    btns.forEach(b => {
                        if (b.dataset.type === selectedType) {
                            b.className = `repeat-btn flex-1 sm:flex-none px-3 py-2 sm:py-1.5 rounded-lg text-sm font-medium transition-colors bg-indigo-100 text-indigo-700 border border-indigo-200`;
                        } else {
                            b.className = `repeat-btn flex-1 sm:flex-none px-3 py-2 sm:py-1.5 rounded-lg text-sm font-medium transition-colors bg-gray-50 text-gray-500 border border-gray-200 hover:bg-gray-100`;
                        }
                    });
                });
            });
        };

        elements.taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = elements.titleInput.value.trim();

            if (!title) {
                elements.errorMsg.classList.remove('hidden');
                return;
            }

            const newTask = {
                id: generateId(),
                title: title,
                isCompleted: false,
                repeatType: currentRepeatType,
                createdDate: currentViewDate // 현재 달력에서 보고 있는 날짜로 생성됨
            };

            state.tasks.push(newTask);
            saveState();

            elements.titleInput.value = '';
            elements.errorMsg.classList.add('hidden');
            document.querySelector('#repeat-type-container .repeat-btn[data-type="NONE"]').click();
        });

        elements.titleInput.addEventListener('input', () => elements.errorMsg.classList.add('hidden'));

        window.toggleTask = (id) => {
            state.tasks = state.tasks.map(task =>
                task.id === id ? { ...task, isCompleted: !task.isCompleted } : task
            );
            saveState();
        };

        window.swapTasks = (id1, id2) => {
            const index1 = state.tasks.findIndex(t => t.id === id1);
            const index2 = state.tasks.findIndex(t => t.id === id2);
            if (index1 !== -1 && index2 !== -1) {
                const temp = state.tasks[index1];
                state.tasks[index1] = state.tasks[index2];
                state.tasks[index2] = temp;
                saveState();
            }
        };

        window.toggleEditMode = (id, isEditing) => {
            const taskItem = document.getElementById(`task-${id}`);
            const viewMode = taskItem.querySelector('.view-mode');
            const editMode = taskItem.querySelector('.edit-mode');
            if (isEditing) {
                viewMode.classList.add('hidden');
                editMode.classList.remove('hidden');
                editMode.querySelector('input').focus();
            } else {
                viewMode.classList.remove('hidden');
                editMode.classList.add('hidden');
            }
        };

        window.saveEdit = (id) => {
            const taskItem = document.getElementById(`task-${id}`);
            const input = taskItem.querySelector('.edit-mode input');
            const newTitle = input.value.trim();
            const newRepeatType = taskItem.dataset.editRepeatType;

            if (newTitle) {
                state.tasks = state.tasks.map(task =>
                    task.id === id ? { ...task, title: newTitle, repeatType: newRepeatType } : task
                );
                saveState();
            }
        };

        window.openDeleteModal = (id) => {
            taskToDeleteId = id;
            elements.deleteModal.classList.remove('hidden');
            setTimeout(() => {
                elements.deleteModalContent.classList.remove('scale-95', 'opacity-0');
                elements.deleteModalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        };

        const closeDeleteModal = () => {
            elements.deleteModalContent.classList.remove('scale-100', 'opacity-100');
            elements.deleteModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                elements.deleteModal.classList.add('hidden');
                taskToDeleteId = null;
            }, 200);
        };

        elements.cancelDeleteBtn.addEventListener('click', closeDeleteModal);
        elements.confirmDeleteBtn.addEventListener('click', () => {
            if (taskToDeleteId) {
                state.tasks = state.tasks.filter(task => task.id !== taskToDeleteId);
                saveState();
                closeDeleteModal();
            }
        });

        const renderTasks = () => {
            const viewTasks = getTasksForViewDate();
            updateProgress(viewTasks);
            elements.taskList.innerHTML = '';

            if (viewTasks.length === 0) {
                elements.emptyState.classList.remove('hidden');
                elements.taskList.classList.add('hidden');
            } else {
                elements.emptyState.classList.add('hidden');
                elements.taskList.classList.remove('hidden');

                viewTasks.forEach((task, index) => {
                    const isFirst = index === 0;
                    const isLast = index === viewTasks.length - 1;
                    const prevTaskId = isFirst ? null : viewTasks[index - 1].id;
                    const nextTaskId = isLast ? null : viewTasks[index + 1].id;

                    const taskEl = document.createElement('div');
                    taskEl.id = `task-${task.id}`;
                    taskEl.dataset.editRepeatType = task.repeatType;
                    taskEl.className = `group flex flex-col p-4 bg-white rounded-xl border transition-all duration-200 hover:shadow-md ${task.isCompleted ? 'border-gray-100 opacity-60' : 'border-gray-200 hover:border-indigo-300'}`;
                    
                    const viewModeHtml = `
                        <div class="view-mode flex flex-col sm:flex-row items-start sm:items-center justify-between w-full gap-3 sm:gap-0">
                            <div class="flex items-start gap-3 overflow-hidden cursor-pointer w-full" onclick="toggleTask('${task.id}')">
                                <div class="mt-0.5 flex-shrink-0 transition-colors ${task.isCompleted ? 'text-emerald-500' : 'text-gray-300 hover:text-indigo-400'}">
                                    ${task.isCompleted ? '<i class="fas fa-check-circle text-2xl"></i>' : '<i class="far fa-circle text-2xl"></i>'}
                                </div>
                                <div class="flex flex-col min-w-0 flex-1">
                                    <span class="text-base font-medium truncate transition-all ${task.isCompleted ? 'text-gray-400 line-through' : 'text-gray-700'}">
                                        ${task.title}
                                    </span>
                                    <div class="flex items-center gap-1.5 mt-1">
                                        <i class="far fa-calendar-alt text-xs ${task.isCompleted ? 'text-gray-400' : 'text-indigo-400'}"></i>
                                        <span class="text-xs ${task.isCompleted ? 'text-gray-400' : 'text-gray-500'}">
                                            ${REPEAT_LABELS[task.repeatType]}
                                        </span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0 self-end sm:self-auto bg-gray-50 sm:bg-transparent p-1 sm:p-0 rounded-lg">
                                <div class="flex flex-row sm:flex-col items-center gap-1 sm:gap-0.5 mr-1 border-r border-gray-200 sm:border-gray-100 pr-2">
                                    <button onclick="swapTasks('${task.id}', '${prevTaskId}')" ${isFirst ? 'disabled' : ''} class="p-1.5 sm:p-0.5 rounded-md transition-colors ${isFirst ? 'opacity-20 cursor-default' : 'text-gray-400 hover:text-indigo-600 active:bg-indigo-100'}" title="위로 이동">
                                        <i class="fas fa-chevron-up text-sm"></i>
                                    </button>
                                    <button onclick="swapTasks('${task.id}', '${nextTaskId}')" ${isLast ? 'disabled' : ''} class="p-1.5 sm:p-0.5 rounded-md transition-colors ${isLast ? 'opacity-20 cursor-default' : 'text-gray-400 hover:text-indigo-600 active:bg-indigo-100'}" title="아래로 이동">
                                        <i class="fas fa-chevron-down text-sm"></i>
                                    </button>
                                </div>
                                <button onclick="toggleEditMode('${task.id}', true)" class="p-2 text-gray-400 hover:text-indigo-600 active:bg-indigo-100 rounded-lg transition-colors" title="수정">
                                    <i class="fas fa-pen text-base sm:text-sm"></i>
                                </button>
                                <button onclick="openDeleteModal('${task.id}')" class="p-2 text-gray-400 hover:text-red-500 active:bg-red-100 rounded-lg transition-colors" title="삭제">
                                    <i class="fas fa-trash text-base sm:text-sm"></i>
                                </button>
                            </div>
                        </div>
                    `;

                    const editModeHtml = `
                        <div class="edit-mode hidden flex flex-col gap-3 w-full bg-indigo-50/50 p-3 sm:p-2 rounded-lg mt-2 sm:mt-0 sm:-m-2">
                            <div class="flex items-center gap-2">
                                <input type="text" value="${task.title}" class="flex-1 px-3 py-3 sm:py-2 bg-white border border-indigo-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-700 w-full text-base">
                            </div>
                            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-0">
                                <div class="flex flex-wrap gap-1.5 w-full sm:w-auto" id="edit-repeat-btns-${task.id}">
                                    ${Object.keys(REPEAT_LABELS).map(type => `
                                        <button type="button" data-type="${type}" class="repeat-btn flex-1 sm:flex-none px-2 py-2 sm:py-1 rounded text-xs sm:text-sm font-medium transition-colors ${task.repeatType === type ? 'bg-indigo-600 text-white' : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-50'}">
                                            ${REPEAT_LABELS[type]}
                                        </button>
                                    `).join('')}
                                </div>
                                <div class="flex gap-2 w-full sm:w-auto justify-end">
                                    <button onclick="toggleEditMode('${task.id}', false)" class="flex-1 sm:flex-none p-2 sm:p-1.5 text-gray-500 hover:bg-white hover:text-gray-700 rounded-lg border border-transparent hover:border-gray-200 transition-all text-sm font-medium">
                                        취소
                                    </button>
                                    <button onclick="saveEdit('${task.id}')" class="flex-1 sm:flex-none px-4 py-2 sm:py-1.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
                                        저장
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;

                    taskEl.innerHTML = viewModeHtml + editModeHtml;
                    elements.taskList.appendChild(taskEl);

                    setupRepeatTypeButtons(`edit-repeat-btns-${task.id}`, (selectedType) => {
                        taskEl.dataset.editRepeatType = selectedType;
                    });
                });
            }
        };

        const init = () => {
            currentViewDate = getTodayString(); // 앱 구동 시 기본 달력 뷰는 '오늘'
            loadState();
            checkAndResetDailyTasks();
            updateHeader();
            setupRepeatTypeButtons();
            renderTasks();
            
            // 다른 탭 갔다가 왔을 때 자정 지났는지 체크 (달력은 그대로 유지하되 체크만 해제)
            window.addEventListener('focus', () => {
                checkAndResetDailyTasks();
            });
        };

        init();
    </script>
</body>
</html>
